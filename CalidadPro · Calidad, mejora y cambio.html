r:()=>card("Informes (PDF)",[["Diagnóstico de calidad"],["Proyecto de mejora"],["Variabilidad y capacidad"],["Auditoría de cumplimiento"],["Implementación del cambio"],["Resumen ejecutivo de indicadores"]].map((x,i)=>`<div class=fm><button onclick="rep(${i+1})">${i+1} · ${x}</button></div>`).join("")+`<div class=fm><button class=o onclick="rep(7)">Manual de uso</button></div>`,"Se abre una vista del informe; pulsa Descargar PDF y elige Guardar como PDF.")};
const kpiT=()=>`<div class=sc><table><tr><th>Indicador<th>Meta<th>Actual<th>Tendencia<th>Estado</tr>${S.kpi.map(k=>{const v=kv(k);return`<tr><td>${esc(k.nombre)}<td>${k.meta}<td>${v.a}<td>${spark(v.s)}<td style="color:${v.bad?"var(--r)":"var(--g)"}">${v.bad?(v.crit?"Crítico":"Alerta"):"En meta"}`}).join("")}</table></div>`;
const cfg=()=>{S.cfg={emp:$("#emp2").value,resp:$("#resp2").value};save();go("i")};
const T=[["i","Inicio"],["a","A Calidad"],["b","B Mejora"],["c","C Cambio"],["d","D Sostenibilidad"],["r","Informes"]];
const go=t=>{tab=t;$("#nav").innerHTML=T.map(x=>`<button class="${x[0]==t?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("#emp").textContent=S.cfg.emp?"· "+S.cfg.emp:"";$("#app").innerHTML=V[t]();window.scrollTo(0,0)};
/* ---------- informes ---------- */
const hd=t=>`<h1>${t}</h1><p class=m>Empresa: ${esc(S.cfg.emp)||"—"} · Fecha: ${hoy} · Responsable: ${esc(S.cfg.resp)||"—"}<br>Fuente de los datos: registros cargados en CalidadPro al ${hoy}.</p>`;
const rep=n=>{const p=par(),s=stats(),ext=S.voc.filter(v=>v.tipo=="Externo").length,al=alerts();let h="";
if(n==1)h=hd("Diagnóstico de calidad")+`<h3>Voz del cliente</h3><p>${S.voc.length} registros: ${ext} de clientes externos y ${S.voc.length-ext} de clientes internos.</p>${tb("voc")}<h3>Pareto de problemas</h3>${p.svg}<h3>Ishikawa de la causa principal</h3>${fish()}<h3>Diagrama de flujo del proceso</h3>${flujoV()}<h3>Mapa de interacción de procesos</h3>${mapaV()}<h3>Conclusión</h3><p>${p.top?`El problema principal es “${esc(p.top)}” (${p.pct}% del total). Las causas identificadas por categoría 6M están en el diagrama; se recomienda abrir un proyecto de mejora sobre ellas.`:"Sin datos suficientes."}</p>`;
if(n==2)h=hd("Proyecto de mejora")+pdca()+proyDet()+tb("proy")+"<h3>Cadena de valor (VSM)</h3>"+vsmV()+"<h3>SMED</h3>"+smedV()+`<h3>Lectura</h3><p>${S.proy.length} proyecto(s). Fases en curso: ${S.proy.map(x=>esc(x.nombre)+" → "+x.fase).join("; ")||"—"}. Los resultados de la prueba piloto figuran en la última columna y deben validarse antes de implementar de forma general.</p>`;
if(n==3)h=hd("Variabilidad y capacidad del proceso")+`<h3>Histograma</h3>${hist(s)}<h3>Gráfico de control (individuales)</h3>${ctrl(s)}${idx(s)}`;
if(n==4)h=hd("Auditoría de cumplimiento")+`<p>Se registraron ${S.aud.length} hallazgos en ${new Set(S.aud.map(x=>x.area)).size} área(s).</p>`+tb("aud")+"<h3>Acciones correctivas y responsables</h3>"+S.aud.map(x=>`<p>• ${esc(x.area)}: ${esc(x.accion)}. Responsable: ${esc(x.resp)}. Clasificación: ${esc(x.clase)}${/método/i.test(x.clase)?" (generó un proyecto de mejora)":""}.</p>`).join("")+`<p>Hallazgos de desempeño del trabajador: ${S.aud.filter(x=>/trabajador/.test(x.clase)).length}. Limitaciones del método: ${S.aud.filter(x=>/método/.test(x.clase)).length}; estas regresan al ciclo de mejora como proyectos nuevos.</p>`;
if(n==5)h=hd("Implementación del cambio")+["Diagnóstico","Diseño","Validación","Implementación","Seguimiento"].map(f=>`<p>${f}: ${prog(f)}% completado</p>`).join("")+tb("fases")+sched()+pulsoV()+"<h3>Partes interesadas y plan de comunicación</h3>"+tb("partes")+"<h3>Patrocinio</h3>"+tb("patro")+`<p>Avance global: ${S.fases.length?Math.round(S.fases.filter(x=>x.estado=="Hecho").length/S.fases.length*100):0}% de las tareas terminadas.</p>`;
if(n==6)h=hd("Resumen ejecutivo de indicadores")+kpiT()+"<h3>Alertas</h3>"+(al.map(x=>`<p>• ${esc(x)}</p>`).join("")||"<p>Sin alertas.</p>")+`<h3>Sostenibilidad</h3><p>${S.kpi.filter(k=>!kv(k).bad).length} de ${S.kpi.length} indicadores en meta. Estándares documentados: ${S.std.length}. Auditorías registradas: ${S.aud.length}.</p><h3>Recomendaciones</h3>`+recs().map(x=>`<p>• ${esc(x)}</p>`).join("");
if(n==7)h=hd("Manual de uso")+`<h3>Para qué sirve</h3><p>CalidadPro reúne en un solo lugar la gestión de calidad, los proyectos de mejora, la gestión del cambio y la sostenibilidad. Lo usan jefes de calidad, supervisores, equipos de mejora y gerencia.</p><h3>Perfiles</h3><p>Jefe de calidad: carga datos, audita y emite informes. Supervisores y operarios: proponen ideas Kaizen y registran hallazgos. Gerencia: revisa KPI, alertas y el resumen ejecutivo.</p><h3>Cómo empezar</h3><p>Abre el enlace (no requiere instalación). En Inicio pulsa “Borrar datos de demostración” y escribe el nombre de tu empresa. Los datos se guardan en tu navegador.</p><h3>Módulos</h3><p><b>A Calidad:</b> registra reclamos o encuestas (cliente interno o externo); el Pareto, la hoja de verificación y el Ishikawa se generan solos; sube procedimientos con versión y fecha de revisión.<br><b>B Mejora:</b> proyectos PDCA/DMAIC, Kaizen, 5S y capacidad del proceso: pega mediciones o importa un CSV, indica LIE y LSE y lee Cp y Cpk.<br><b>C Cambio:</b> tareas por fase, partes interesadas con su plan de comunicación y registro del patrocinio.<br><b>D Sostenibilidad:</b> método estándar, auditorías (los hallazgos del método abren un proyecto) y tablero de KPI con alertas.</p><h3>Recorrido de 5 minutos con el caso demo</h3><p>1) En Inicio lee las alertas y recomendaciones. 2) En A agrega un reclamo y mira cómo cambia el Pareto. 3) En B pega nuevas mediciones y observa Cp, Cpk y los puntos rojos. 4) En C marca una tarea como Hecho y revisa el avance contra el cronograma. 5) En D registra un hallazgo de clase “Limitación del método” y verifica que aparezca un proyecto nuevo en B. Cada registro tiene ✎ para editar y ✕ para borrar. Opcionales: el diagrama de flujo y el mapa de procesos están en A; VSM, SMED y el cronómetro en B.</p><h3>Informes</h3><p>En la pestaña Informes elige uno, pulsa Descargar PDF y selecciona “Guardar como PDF”.</p><h3>Interpretación</h3><p>Cpk menor que 1: el proceso no cumple especificaciones. Entre 1 y 1.33: marginal. Mayor que 1.33: capaz. Puntos rojos en el gráfico de control: causa especial, hay que investigarlos. Sin puntos rojos: variación de causa común.</p><h3>Problemas frecuentes</h3><p>Los gráficos no aparecen: faltan datos (mínimo 5 mediciones). Cpk vacío: falta LIE o LSE. Datos perdidos: no borres los datos del navegador; los datos son locales.</p>`;
$("#pr").innerHTML=`<div class=nb><button onclick="window.print()">Descargar PDF</button> <button class=o onclick="$('#pr').style.display='none'">Cerrar</button> <span class=m>Elige “Guardar como PDF” como destino.</span></div>`+h;$("#pr").style.display="block"};
go("i");
try{if(localStorage.getItem("cpcloud"))cin()}catch(e){}
</script></body></html>
